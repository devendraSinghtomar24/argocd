apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: acrentprod001.azurecr.io/ingestion:v2
        ports:
        - containerPort: 8000
