apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.axionui.ingress_name }}
  labels:
    app.kubernetes.io/name: axion-ingress
spec:
  ingressClassName: {{.Values.axionui.className }}
  
  rules:
  - host: axion-ui.devendraonline.in
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Values.axionui.svcname }}
            port: 
              number: {{ .Values.axionui.containerPort }}
